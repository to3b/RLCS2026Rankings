<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RLCS 2026 Seed Tracker</title>
<style>
  .srow { transition: background 0.08s; cursor: pointer; }
  .srow:hover { background: #13141d !important; }
  .sth { cursor: pointer; user-select: none; transition: color 0.1s; }
  .sth:hover { color: #00d4ff !important; }
  .mjbtn, .rfbtn { transition: all 0.1s; }
  .xarr { display: inline-block; transition: transform 0.15s; }
  .tchip:hover { border-color: rgba(255,255,255,0.22) !important; }
  .loading-msg { text-align: center; font-family: var(--font-mono); color: #555; padding: 40px; font-size: 14px; }
</style>
</head>
<body style="margin:0; background:#08090c;">
<div id="root" style="background:#08090c; color:#d8d8d8; font-family:var(--font-sans); padding-bottom:32px;"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useMemo,useEffect,createElement:h,Fragment}=React;

// 🛑 PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL HERE
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5xfObQPSQ7NBH__MuzeVy4PF7jUaga0Dqvf7Knj7DvpM1NtVu4jIf68HbGB3YYd8V_rTyaFL7GMIS/pub?output=csv";

const RC={
  "Europe":            {code:"EU",  slots:5,c:"#5fa8ff",bg:"rgba(95,168,255,0.1)", br:"rgba(95,168,255,0.4)" },
  "North America":     {code:"NA",  slots:4,c:"#ff7c52",bg:"rgba(255,124,82,0.1)", br:"rgba(255,124,82,0.4)" },
  "MENA":              {code:"MENA",slots:2,c:"#f5c842",bg:"rgba(245,200,66,0.1)", br:"rgba(245,200,66,0.4)" },
  "South America":     {code:"SAM", slots:2,c:"#6ee89a",bg:"rgba(110,232,154,0.1)",br:"rgba(110,232,154,0.4)"},
  "Asia-Pacific":      {code:"APAC",slots:1,c:"#b09cf0",bg:"rgba(176,156,240,0.1)",br:"rgba(176,156,240,0.4)"},
  "Oceania":           {code:"OCE", slots:1,c:"#f08ab8",bg:"rgba(240,138,184,0.1)",br:"rgba(240,138,184,0.4)"},
  "Sub-Saharan Africa":{code:"SSA", slots:1,c:"#5ecfb8",bg:"rgba(94,207,184,0.1)", br:"rgba(94,207,184,0.4)" },
};

// Map broken/shortened paste entries back to official categories smoothly
function normalizeRegion(r) {
  if (!r) return "Europe";
  const low = r.toLowerCase().trim();
  if (low.includes("europe") || low === "eu") return "Europe";
  if (low.includes("north") || low === "na" || (low === "america" && r !== "South America")) return "North America";
  if (low.includes("south") || low === "sam") return "South America";
  if (low.includes("mena") || low.includes("east")) return "MENA";
  if (low.includes("apac") || low.includes("pacific") || low.includes("asia")) return "Asia-Pacific";
  if (low.includes("oce") || low.includes("oceania")) return "Oceania";
  if (low.includes("ssa") || low.includes("sub") || low === "africa") return "Sub-Saharan Africa";
  return "Europe";
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
  if (lines.length < 2) return [];
  
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  
  return lines.slice(1).map(line => {
    const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
    const cleanValues = values.map(v => v.trim().replace(/^"|"$/g, ''));
    
    const row = {};
    headers.forEach((header, index) => {
      row[header] = cleanValues[index] || "";
    });

    const finalRegion = normalizeRegion(row.region);

    return {
      seed: row.seed || "UNK",
      region: finalRegion,
      major1: {
        wins: parseInt(row.m1_wins) || 0,
        losses: parseInt(row.m1_losses) || 0,
        gd: parseInt(row.m1_gd) || 0,
        teams: row.m1_teams ? row.m1_teams.split(';').map(t => t.trim()) : []
      },
      major2: {
        wins: parseInt(row.m2_wins) || 0,
        losses: parseInt(row.m2_losses) || 0,
        gd: parseInt(row.m2_gd) || 0,
        teams: row.m2_teams ? row.m2_teams.split(';').map(t => t.trim()) : []
      }
    };
  });
}

function proc(raw){
  return raw.map(s=>{
    const cW=s.major1.wins+s.major2.wins, cL=s.major1.losses+s.major2.losses, cGD=s.major1.gd+s.major2.gd;
    const m1T=s.major1.wins+s.major1.losses, m2T=s.major2.wins+s.major2.losses;
    return{...s,slots:RC[s.region]?.slots||1,combined:{wins:cW,losses:cL,gd:cGD},
      m1p:m1T>0?s.major1.wins/m1T:0, m2p:m2T>0?s.major2.wins/m2T:0,
      cp:(cW+cL)>0?cW/(cW+cL):0, cgd:cGD};
  });
}

function wc(p){if(p>=0.65)return"#7ee87e";if(p>=0.5)return"#aee8a0";if(p>=0.35)return"#f5c842";return"#ff7272";}
function gc(g){return g>0?"#7ee87e":g<0?"#ff7272":"#666";}
function fp(n){return(n*100).toFixed(1)+"%";}
function fg(n){return(n>0?"+":"")+n;}

function WinCell({pct,large}){
  const c=wc(pct);
  return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}},
    h("span",{style:{fontFamily:"var(--font-mono)",fontSize:large?16:12,fontWeight:large?700:500,color:large?c:wc(pct),letterSpacing:0.5,opacity:large?1:0.75}},fp(pct)),
    h("div",{style:{width:large?54:40,height:large?3:2,background:"rgba(255,255,255,0.07)",borderRadius:2,overflow:"hidden"}},
      h("div",{style:{width:`${pct*100}%`,height:"100%",background:large?c:"#333",borderRadius:2}})
    )
  );
}

function ExpandPanel({row,am}){
  const mc=RC[row.region];
  return h("tr",null,
    h("td",{colSpan:9,style:{background:"#060709",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px 22px 48px"}},
      h("div",{style:{display:"flex",gap:14,paddingTop:18}},
        ...[{label:"MAJOR 1",key:"major1",data:row.major1,pct:row.m1p},{label:"MAJOR 2",key:"major2",data:row.major2,pct:row.m2p}]
          .map(({label,key,data,pct})=>{
            const isAct=am===key;
            return h("div",{key,style:{flex:1,background:"#0e1018",border:`1px solid ${isAct?"rgba(0,212,255,0.28)":"rgba(255,255,255,0.07)"}`,borderRadius:6,padding:"16px 20px",position:"relative",overflow:"hidden"}},
              isAct&&h("div",{style:{position:"absolute",top:0,left:0,right:0,height:2,background:"#00d4ff",borderRadius:"6px 6px 0 0"}}),
              h("div",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:isAct?"#00d4ff":"#444",letterSpacing:2.5,marginBottom:14}},label),
              h("div",{style:{fontFamily:"var(--font-mono)",fontSize:26,fontWeight:700,color:wc(pct),marginBottom:10,letterSpacing:-0.5}},fp(pct)),
              h("div",{style:{display:"flex",gap:18,marginBottom:16,fontFamily:"var(--font-mono)",fontSize:13}},
                h("span",{style:{color:"#7ee87e",fontWeight:600}},data.wins+"W"),
                h("span",{style:{color:"#ff7272",fontWeight:600}},data.losses+"L"),
                h("span",{style:{color:gc(data.gd),fontWeight:700}},fg(data.gd)+" GD")
              ),
              h("div",{style:{borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:14}},
                h("div",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#3a3a48",letterSpacing:2,marginBottom:10}},"TEAM OCCUPYING SEED"),
                h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
                  ...data.teams.map(t=>h("span",{key:t,className:"tchip",style:{
                    padding:"6px 13px",background:mc?.bg||"rgba(255,255,255,0.04)",
                    border:`1px solid ${mc?.br||"rgba(255,255,255,0.1)"}`,
                    borderRadius:3,fontSize:13,color:mc?.c||"#ccc",
                    fontFamily:"var(--font-sans)",fontWeight:500,letterSpacing:0.3
                  }},t))
                )
              )
            );
          }),
        h("div",{style:{display:"flex",flexDirection:"column",justifyContent:"center",padding:"0 10px",gap:8,minWidth:96,borderLeft:"1px solid rgba(255,255,255,0.06)",paddingLeft:24}},
          h("div",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#333",letterSpacing:2}},"COMBINED"),
          h("div",{style:{fontFamily:"var(--font-mono)",fontSize:20,fontWeight:700,color:wc(row.cp),marginBottom:4}},fp(row.cp)),
          h("div",{style:{fontFamily:"var(--font-mono)",fontSize:12,display:"flex",flexDirection:"column",gap:4}},
            h("span",null,h("span",{style:{color:"#7ee87e",fontWeight:600}},row.combined.wins+"W"),h("span",{style:{color:"#3a3a48",margin:"0 4px"}},"/"),h("span",{style:{color:"#ff7272",fontWeight:600}},row.combined.losses+"L")),
            h("span",{style:{color:gc(row.cgd),fontWeight:700}},fg(row.cgd)+" GD")
          )
        )
      )
    )
  );
}

function App(){
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [sf,setSf]=useState("cp");
  const [sd,setSd]=useState("desc");
  const [exp,setExp]=useState(new Set());
  const [rf,setRf]=useState("All");
  const [am,setAm]=useState("combined");

  useEffect(() => {
    if (SHEET_CSV_URL === "YOUR_GOOGLE_SHEET_CSV_URL_HERE") {
      setLoading(false);
      return;
    }
    fetch(SHEET_CSV_URL)
      .then(res => res.text())
      .then(text => {
        const parsed = parseCSV(text);
        setData(proc(parsed));
        setLoading(false);
      })
      .catch(err => {
        console.error("Error loading Google Sheet data:", err);
        setLoading(false);
      });
  }, []);

  const sorted=useMemo(()=>{
    let d=rf==="All"?data:data.filter(x=>x.region===rf);
    return[...d].sort((a,b)=>{
      const av=a[sf],bv=b[sf];
      if(typeof av warm=== "string")return sd==="asc"?av.localeCompare(bv):bv.localeCompare(av);
      return sd==="desc"?bv-av:av-bv;
    });
  },[sf,sd,rf,data]);

  if (SHEET_CSV_URL === "YOUR_GOOGLE_SHEET_CSV_URL_HERE") {
    return h("div", {className:"loading-msg"}, "⚠️ Please replace 'YOUR_GOOGLE_SHEET_CSV_URL_HERE' inside the code with your actual published CSV link.");
  }

  if (loading) {
    return h("div", {className:"loading-msg"}, "Loading leaderboard data from Google Sheets...");
  }

  function hs(f){if(f===sf)setSd(d=>d==="desc"?"asc":"desc");else{setSf(f);setSd("desc");}}
  function te(seed){setExp(p=>{const s=new Set(p);s.has(seed)?s.delete(seed):s.add(seed);return s;});}

  const wlKey=am==="combined"?"combined":am;
  const regions=["All",...Object.keys(RC)];

  const TH=({label,field,align,wide})=>h("th",{
    className:field?"sth":"",onClick:field?()=>hs(field):undefined,
    style:{padding:"11px 12px",fontFamily:"var(--font-mono)",fontSize:9,fontWeight:600,
      letterSpacing:2.5,textTransform:"uppercase",color:sf===field?"#00d4ff":"#555",
      textAlign:align||"left",whiteSpace:"nowrap",borderBottom:"1px solid rgba(255,255,255,0.1)",
      background:"#0b0c12"}
  },label+(field&&sf===field?(sd==="desc"?" ↓":" ↑"):""));

  return h(Fragment,null,
    h("h2",{className:"sr-only"},"RLCS 2026 seed performance leaderboard"),

    h("div",{style:{borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"24px 28px 22px",display:"flex",alignItems:"flex-end",justifyContent:"space-between",flexWrap:"wrap",gap:16}},
      h("div",null,
        h("div",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#333",letterSpacing:3.5,textTransform:"uppercase",marginBottom:8}},"RLCS 2026 — Live Sheet Analytics"),
        h("div",{style:{fontSize:22,fontWeight:500,color:"#f2f2f2",margin:0,letterSpacing:0.3}},"Seed Performance Tracker"),
        h("div",{style:{fontSize:12,color:"#555",marginTop:5,fontFamily:"var(--font-mono)"}},`${data.length} seeds active · 7 regions`)
      ),
      h("div",{style:{display:"flex",gap:2,background:"#050508",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:3}},
        ...[["major1","Major 1"],["major2","Major 2"],["combined","Combined"]].map(([k,l])=>
          h("button",{key:k,className:"mjbtn",onClick:()=>setAm(k),style:{
            padding:"7px 18px",border:"none",borderRadius:4,cursor:"pointer",
            fontFamily:"var(--font-mono)",fontSize:10,fontWeight:500,letterSpacing:1.5,textTransform:"uppercase",
            background:am===k?"#00d4ff":"transparent",color:am===k?"#05060a":"#3a3a50"
          }},l)
        )
      )
    ),

    h("div",{style:{padding:"20px 28px"}},

      h("div",{style:{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}},
        ...regions.map(r=>{
          const m=RC[r]; const active=rf===r;
          return h("button",{key:r,className:"rfbtn",onClick:()=>setRf(r),style:{
            padding:"5px 14px",borderRadius:3,
            border:active?`1px solid ${m?.br||"rgba(0,212,255,0.5)"}`:"1px solid rgba(255,255,255,0.08)",
            background:active?(m?.bg||"rgba(0,212,255,0.08)"):"transparent",
            color:active?(m?.c||"#00d4ff"):"#444",
            fontFamily:"var(--font-mono)",fontSize:9,fontWeight:500,letterSpacing:2,textTransform:"uppercase",cursor:"pointer"
          }},r==="All"?"All Regions":(m?.code||r));
        })
      ),

      h("div",{style:{border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,overflow:"hidden"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}},
          h("colgroup",null,
            ...[34,198,62,72,72,88,66,52,34].map((w,i)=>h("col",{key:i,style:{width:w}}))
          ),
          h("thead",null,
            h("tr",null,
              h(TH,{label:"#",align:"center"}),
              h(TH,{label:"Seed / Teams",field:"seed",align:"left"}),
              h(TH,{label:"Region",field:"region",align:"left"}),
              h(TH,{label:"M1 W%",field:"m1p",align:"right"}),
              h(TH,{label:"M2 W%",field:"m2p",align:"right"}),
              h(TH,{label:"Combined",field:"cp",align:"right"}),
              h(TH,{label:`${am==="major1"?"M1":am==="major2"?"M2":"All"} W \u2014 L`,align:"center"}),
              h(TH,{label:"GD",field:"cgd",align:"center"}),
              h("th",{style:{background:"#0b0c12",borderBottom:"1px solid rgba(255,255,255,0.1)"}})
            )
          ),
          h("tbody",null,
            sorted.map((row,idx)=>{
              const m=RC[row.region];
              const isOpen=exp.has(row.seed);
              const wld=row[wlKey];
              const gd=wld?.gd??0;
              const rowBg=idx%2===0?"#0e0f14":"#0b0c11";

              return h(Fragment,{key:row.seed},
                h("tr",{className:"srow",style:{borderBottom:isOpen?"none":"1px solid rgba(255,255,255,0.05)",background:rowBg},onClick:()=>te(row.seed)},

                  h("td",{style:{padding:"16px 12px",textAlign:"center",fontFamily:"var(--font-mono)",fontSize:12,color:"#3a3a50",fontWeight:500}},idx+1),

                  h("td",{style:{padding:"14px 12px"}},
                    h("div",{style:{display:"flex",flexDirection:"column",gap:7}},
                      h("span",{style:{display:"inline-flex",alignSelf:"flex-start",padding:"3px 11px 3px 10px",borderRadius:3,background:m?.bg,color:m?.c,fontFamily:"var(--font-mono)",fontSize:13,fontWeight:700,borderLeft:`3px solid ${m?.c}`,letterSpacing:0.5}},row.seed),
                      h("div",{style:{display:"flex",flexDirection:"column",gap:4,paddingLeft:1}},
                        h("div",{style:{display:"flex",alignItems:"center",gap:6}},
                          h("span",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#00d4ff",letterSpacing:1,opacity:0.7,minWidth:14}},"M1"),
                          h("span",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#2a2a38"}}," \u2014 "),
                          h("span",{style:{fontFamily:"var(--font-sans)",fontSize:11,color:"#b0b0c0",fontWeight:400}},row.major1.teams.join(', ') || "None")
                        ),
                        h("div",{style:{display:"flex",alignItems:"center",gap:6}},
                          h("span",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#00d4ff",letterSpacing:1,opacity:0.7,minWidth:14}},"M2"),
                          h("span",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#2a2a38"}}," \u2014 "),
                          h("span",{style:{fontFamily:"var(--font-sans)",fontSize:11,color:"#b0b0c0",fontWeight:400}},row.major2.teams.join(', ') || "None")
                        )
                      )
                    )
                  ),

                  h("td",{style:{padding:"14px 12px"}},
                    h("div",{style:{display:"flex",flexDirection:"column",gap:4}},
                      h("span",{style:{fontFamily:"var(--font-mono)",fontSize:13,color:"#aaa",fontWeight:600}},m?.code||row.region),
                      h("span",{style:{fontFamily:"var(--font-mono)",fontSize:9,color:"#3a3a48",letterSpacing:0.5}},`${m?.slots || 1} slot${(m?.slots||1)>1?"s":""}`)
                    )
                  ),

                  h("td",{style:{padding:"14px 12px",textAlign:"right"}},h(WinCell,{pct:row.m1p,large:am warm=== "major1"})),
                  h("td",{style:{padding:"14px 12px",textAlign:"right"}},h(WinCell,{pct:row.m2p,large:am warm=== "major2"})),
                  h("td",{style:{padding:"14px 12px",textAlign:"right"}},h(WinCell,{pct:row.cp,large:am warm=== "combined"})),

                  h("td",{style:{padding:"14px 12px",textAlign:"center",fontFamily:"var(--font-mono)",fontSize:15}},
                    h("span",{style:{color:"#7ee87e",fontWeight:700}},wld?.wins),
                    h("span",{style:{color:"#222232",margin:"0 7px"}},"\u2014"),
                    h("span",{style:{color:"#ff7272",fontWeight:700}},wld?.losses)
                  ),

                  h("td",{style:{padding:"14px 12px",textAlign:"center",fontFamily:"var(--font-mono)",fontSize:14,fontWeight:700,color:gc(gd)}},fg(gd)),

                  h("td",{style:{padding:"14px 12px",textAlign:"center"}},
                    h("span",{className:"xarr",style:{fontSize:9,color:isOpen?"#00d4ff":"#2a2a3a",transform:isOpen?"rotate(90deg)":"none"}},"▶")
                  )
                ),
                isOpen&&h(ExpandPanel,{key:row.seed+"-exp",row,am})
              );
            })
          )
        )
      ),

      h("div",{style:{marginTop:16,display:"flex",justifyContent:"space-between",fontFamily:"var(--font-mono)",fontSize:9,color:"#222232",letterSpacing:1}},
        h("span",null,`CONNECTED TO GOOGLE SHEETS \u00b7 ${sorted.length} SEEDS LOADED`),
        h("span",null,"CLICK ROW TO EXPAND MAJOR BREAKDOWN")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
