<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Seed Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08090c;
  --card:#0b0c12;
  --muted:#aab2c5;
  --muted-2:#9aa3b8;
  --text:#d8d8d8;
  --accent:#00d4ff;
  --panel-border: rgba(255,255,255,0.06);
  --mono:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
#root{
  padding:20px 22px 40px;
  max-width:1200px;
  margin:0 auto;
  box-sizing:border-box;
}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--panel-border);
  margin-bottom:18px;
}
.title{
  font-size:18px;
  font-weight:600;
  color:var(--text);
  margin:0;
  letter-spacing:0.2px;
}
.subtitle{
  font-size:12px;
  color:var(--muted);
  margin:0;
}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border:1px solid var(--panel-border);
  border-radius:10px;
  padding:18px;
  box-sizing:border-box;
}
.controls{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.btn{
  background:transparent;
  border:1px solid rgba(255,255,255,0.08);
  color:var(--muted-2);
  padding:7px 12px;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
  font-weight:600;
}
.btn.active{
  background:rgba(0,212,255,0.06);
  border-color:rgba(0,212,255,0.28);
  color:var(--accent);
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
}
thead th{
  text-align:left;
  padding:12px 10px;
  font-size:12px;
  font-weight:700;
  color:var(--muted-2);
  text-transform:uppercase;
  letter-spacing:1px;
  border-bottom:1px solid var(--panel-border);
}
tbody td{
  padding:12px 10px;
  vertical-align:middle;
  color:var(--text);
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.seed-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:6px;
  font-weight:700;
  font-size:13px;
}
.region{
  font-size:13px;
  color:var(--muted);
  font-weight:600;
}
.small-muted{
  font-size:11px;
  color:var(--muted);
}
.wcell{
  text-align:right;
  font-family:var(--mono);
  font-weight:700;
}
.gd{
  font-weight:700;
  color:var(--muted-2);
}
.expand-toggle{
  text-align:center;
  color:var(--muted);
  cursor:pointer;
  transition:transform 0.15s ease;
}
@media (max-width:900px){
  #root{ padding:14px; }
  .title{ font-size:16px; }
  thead th{ font-size:11px; }
  tbody td{ font-size:12px; }
}
</style>
</head>

<body>
<div id="root">
<div class="header">
  <div>
    <h1 class="title">Seed Tracker</h1>
    <div class="subtitle">Live leaderboard</div>
  </div>
</div>

<div class="card" id="app-root">
  <div id="react-mount"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
(function(){
  const { useState, useEffect, useMemo } = React;

  // ─── DATA SOURCE ─────────────────────────────────────────────────────────────
  // Set mode to 'live' and the app will fetch from your CSV URL instead of fake data.
  const CONFIG = {
    mode: 'fake',  // 'fake' | 'live'
    url:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vR5xfObQPSQ7NBH__MuzeVy4PF7jUaga0Dqvf7Knj7DvpM1NtVu4jIf68HbGB3YYd8V_rTyaFL7GMIS/pub?output=csv'
  };
  // ─────────────────────────────────────────────────────────────────────────────

  const FAKE_CSV = `region,m1wins,m1losses,m1gd,m1teams,m2wins,m2losses,m2gd,m2teams
EU,21,11,10,M8,0,0,0,VIT
EU,14,14,0,KC,0,0,0,M8
EU,19,9,10,VIT,0,0,0,NIP
EU,9,9,0,NIP,0,0,0,KC
EU,10,10,0,GK,0,0,0,MCI
NA,17,12,5,NRG,0,0,0,NRG
NA,11,11,0,SR,0,0,0,SSG
NA,6,8,-2,VP,0,0,0,SR
NA,3,9,-6,SSG,0,0,0,FUT
OCE,6,6,0,PWR,0,0,0,WC
SAM,6,8,-2,FUR,0,0,0,MIBR
SAM,7,7,0,MIBR,0,0,0,FUR
MENA,17,13,4,FLCN,0,0,0,TWIS
MENA,5,7,-2,TWIS,0,0,0,R8
APAC,1,9,-8,TSM,0,0,0,TSM
SSA,0,9,-9,5F,0,0,0,5F`;

  function parseCSVtext(text){
    if(!text) return [];
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
    return lines.slice(1).map(line => {
      const values = (line.match(/(?:".*?"|[^,])+/g) || line.split(',')).map(v => v.trim().replace(/^"|"$/g,''));
      const row = {};
      headers.forEach((h,i) => row[h] = values[i] ?? '');
      return {
        region: row.region || '',
        major1: {
          wins:   parseInt(row.m1wins   || 0, 10),
          losses: parseInt(row.m1losses || 0, 10),
          gd:     parseInt(row.m1gd     || 0, 10),
          team:   row.m1teams || ''
        },
        major2: {
          wins:   parseInt(row.m2wins   || 0, 10),
          losses: parseInt(row.m2losses || 0, 10),
          gd:     parseInt(row.m2gd     || 0, 10),
          team:   row.m2teams || ''
        }
      };
    });
  }

  function processRows(parsed){
    const regionCount = {};
    return parsed.map(r => {
      const key = (r.region || '').toUpperCase();
      regionCount[key] = (regionCount[key] || 0) + 1;
      const seedName = `${key}${regionCount[key]}`;
      const combinedWins   = r.major1.wins   + r.major2.wins;
      const combinedLosses = r.major1.losses + r.major2.losses;
      const combinedGD     = r.major1.gd     + r.major2.gd;
      return {
        ...r,
        seedName,
        combined: { wins: combinedWins, losses: combinedLosses, gd: combinedGD }
      };
    });
  }

  function h(tag, props, ...children){
    return React.createElement(tag, props, ...children);
  }

  function App(){
    const [data, setData] = useState([]);
    const [loading, setLoading] = useState(true);
    const [view, setView] = useState('combined');
    const [regionFilter, setRegionFilter] = useState('All');

    useEffect(() => {
      if(CONFIG.mode === 'live'){
        setLoading(true);
        fetch(CONFIG.url)
          .then(res => res.text())
          .then(text => { setData(processRows(parseCSVtext(text))); setLoading(false); })
          .catch(err => { console.error('Failed to load CSV', err); setLoading(false); });
      } else {
        setData(processRows(parseCSVtext(FAKE_CSV)));
        setLoading(false);
      }
    }, []);

    const regions = useMemo(() => {
      const set = new Set(data.map(d => d.region).filter(Boolean));
      return ['All', ...Array.from(set)];
    }, [data]);

    const shown = useMemo(() => {
      const src = view === 'major1' ? 'major1' : view === 'major2' ? 'major2' : 'combined';
      return data
        .filter(d => regionFilter === 'All' ? true : d.region === regionFilter)
        .slice()
        .sort((a, b) => {
          const wDiff = (b[src].wins || 0) - (a[src].wins || 0);
          if(wDiff !== 0) return wDiff;
          return (b[src].gd || 0) - (a[src].gd || 0);
        });
    }, [data, regionFilter, view]);

    const src = view === 'major1' ? 'major1' : view === 'major2' ? 'major2' : 'combined';
    const isCombined = view === 'combined';

    return h('div', null,
      h('div', { className:'controls' },
        h('div', null,
          h('button', { className:`btn ${view==='major1' ? 'active' : ''}`, onClick:() => setView('major1') }, 'Major 1'),
          h('button', { className:`btn ${view==='major2' ? 'active' : ''}`, onClick:() => setView('major2'), style:{ marginLeft:6 } }, 'Major 2'),
          h('button', { className:`btn ${view==='combined' ? 'active' : ''}`, onClick:() => setView('combined'), style:{ marginLeft:6 } }, 'Combined')
        ),
        h('div', { style:{ marginLeft:'auto', display:'flex', gap:8 } },
          regions.map(r => h('button', { key:r, className:`btn ${regionFilter===r ? 'active' : ''}`, onClick:() => setRegionFilter(r) }, r))
        )
      ),
      loading
        ? h('div', { style:{ padding:20, color:'var(--muted)' } }, 'Loading leaderboard data...')
        : h('table', null,
            h('colgroup', null,
              h('col', { style:{ width:'34px' } }),
              h('col', { style:{ width:'198px' } }),
              h('col', { style:{ width:'62px' } }),
              isCombined ? h('col', { style:{ width:'72px' } }) : null,
              isCombined ? h('col', { style:{ width:'72px' } }) : null,
              h('col', { style:{ width:'88px' } }),
              h('col', { style:{ width:'66px' } }),
              h('col', { style:{ width:'52px' } }),
              h('col', { style:{ width:'34px' } })
            ),
            h('thead', null,
              h('tr', null,
                h('th', null, '#'),
                h('th', null, 'Seed / Teams'),
                h('th', null, 'Region'),
                isCombined ? h('th', { style:{ textAlign:'right' } }, 'M1 W') : null,
                isCombined ? h('th', { style:{ textAlign:'right' } }, 'M2 W') : null,
                h('th', { style:{ textAlign:'right' } }, isCombined ? 'Combined' : view === 'major1' ? 'M1 Wins' : 'M2 Wins'),
                h('th', { style:{ textAlign:'center' } }, 'W / L'),
                h('th', { style:{ textAlign:'center' } }, 'GD'),
                h('th', null, '')
              )
            ),
            h('tbody', null,
              shown.map((row, idx) => {
                const w = row[src].wins || 0;
                const l = row[src].losses || 0;
                const gd = row[src].gd || 0;
                const displayTeam = view === 'major2' ? row.major2.team : row.major1.team;
                const subLabel    = view === 'combined'
                  ? [row.major1.team, row.major2.team].filter(Boolean).join(' · ')
                  : view === 'major1' ? row.major1.team : row.major2.team;
                return h(React.Fragment, { key: `${row.region}-${row.major1.team}-${idx}` },
                  h('tr', { style:{ cursor:'pointer' } },
                    h('td', { style:{ textAlign:'center', fontFamily:'var(--mono)', color:'var(--muted-2)' } }, idx + 1),
                    h('td', null,
                      h('div', { style:{ display:'flex', flexDirection:'column', gap:4 } },
                        h('span', { className:'seed-pill', style:{ background:'transparent', color:'#dfe7f5', borderLeft:`3px solid ${getRegionColor(row.region)}` } }, row.seedName),
                        subLabel ? h('div', { className:'small-muted' }, subLabel) : null
                      )
                    ),
                    h('td', null, h('div', { className:'region' }, row.region || '—')),
                    isCombined ? h('td', { className:'wcell' }, row.major1.wins || 0) : null,
                    isCombined ? h('td', { className:'wcell' }, row.major2.wins || 0) : null,
                    h('td', { className:'wcell' }, w),
                    h('td', { style:{ textAlign:'center', fontFamily:'var(--mono)', fontWeight:700, color:'var(--text)' } },
                      h('span', { style:{ color:'#7ee87e' } }, w),
                      h('span', { style:{ color:'var(--muted)', margin:'0 6px' } }, '/'),
                      h('span', { style:{ color:'#ff7272' } }, l)
                    ),
                    h('td', { className:'gd' }, gd > 0 ? `+${gd}` : gd),
                    h('td', { className:'expand-toggle' }, '›')
                  )
                );
              })
            )
          )
    );
  }

  function getRegionColor(region){
    const map = {
      'eu':   '#95a8ff',
      'na':   '#ff7c52',
      'mena': '#f5c842',
      'sam':  '#6ee89a',
      'apac': '#b09cf0',
      'oce':  '#f08ab8',
      'ssa':  '#5ecfb8'
    };
    return map[(region || '').trim().toLowerCase()] || '#9aa3b8';
  }

  const mount = document.getElementById('react-mount');
  ReactDOM.createRoot(mount).render(React.createElement(App));
})();
</script>
</body>
</html>
